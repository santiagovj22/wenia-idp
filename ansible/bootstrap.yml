---
# Story 1.3 / AD-18: Environment bootstrap playbook.
# Runs via Docker (no native Ansible needed on Windows).
# All tasks are file-only; no file modes are set (Windows mount compatibility).
# Idempotency proof: a second run must report changed=0.
#
# Run command (from the repo root):
#   docker run --rm -v "${PWD}:/workspace" -w /workspace cytopia/ansible:2.15 \
#     ansible-playbook ansible/bootstrap.yml -c local

- name: Bootstrap local environment
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Resolve to the repo root regardless of where the playbook is called from.
    workspace: "{{ playbook_dir | dirname }}"

  tasks:
    - name: Ensure data/ directory exists (run log written here by the module)
      ansible.builtin.file:
        path: "{{ workspace }}/data"
        state: directory

    - name: Create .env from .env.example when missing (never overwrites)
      ansible.builtin.copy:
        src: "{{ workspace }}/.env.example"
        dest: "{{ workspace }}/.env"
        force: false

    - name: Render backstage/app-config.local.yaml when missing (never overwrites)
      ansible.builtin.copy:
        dest: "{{ workspace }}/backstage/app-config.local.yaml"
        force: false
        content: |
          # Local development overrides — created by ansible/bootstrap.yml.
          # Gitignored. Edit freely; the playbook will not overwrite it.
          #
          # Uncomment and edit the section below to enable New Relic telemetry
          # for local development (story 5.2). The license key must also be set
          # in .env as NEW_RELIC_LICENSE_KEY.
          #
          # techdocs:
          #   builder: 'local'
          #
          # Leave this file in place; removing it will cause Backstage to
          # skip local overrides on the next docker compose up.
