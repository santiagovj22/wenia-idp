# CD caller — copied without templating (AD-6) so ${{ }} is GitHub Actions syntax.
# Calls the shared reusable workflow pinned to @v1 (AD-8).
# AD-8: CD does NOT run on pull requests. Triggered only by version tags or manual dispatch.
name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  cd:
    uses: santiagovj22/wenia-platform-workflows/.github/workflows/cd.yml@v1
    with:
      service-name: replace-with-service-name
      language: nodejs
      node-version: '22'
